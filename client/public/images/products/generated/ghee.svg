<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maa Saraswati Pure Bilona Desi Ghee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFCF1"/>
      <stop offset="1" stop-color="#F6E7C4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8D9AE" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#FFFDF4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DCC793" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ghee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBD979"/>
      <stop offset="0.5" stop-color="#F2B93C"/>
      <stop offset="1" stop-color="#D9921F"/>
    </linearGradient>
    <linearGradient id="lid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#8E2418"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="130" cy="250" r="165" fill="#F2B93C" opacity="0.16"/>
  <circle cx="800" cy="870" r="170" fill="#B3341F" opacity="0.06"/>
  <g opacity="0.4" fill="#D9921F">
    <circle cx="790" cy="300" r="8"/><circle cx="840" cy="360" r="5"/><circle cx="110" cy="700" r="7"/>
  </g>

  <!-- brand badge -->
  <g transform="translate(450,120)">
    <path d="M-175,-70h350a45,45 0 0 1 45,45v50a45,45 0 0 1 -45,45h-350a45,45 0 0 1 -45,-45v-50a45,45 0 0 1 45,-45z" fill="#C8102E"/>
    <path d="M-160,-58h320a36,36 0 0 1 36,36v42a36,36 0 0 1 -36,36h-320a36,36 0 0 1 -36,-36v-42a36,36 0 0 1 36,-36z" fill="none" stroke="#fff" stroke-width="5" opacity="0.85"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#fff" letter-spacing="2">MAA</text>
    <text x="0" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#fff" letter-spacing="1">SARASWATI</text>
  </g>

  <!-- jar -->
  <g transform="translate(450,600)">
    <ellipse cx="0" cy="250" rx="195" ry="42" fill="#B0781B" opacity="0.2"/>
    <!-- glass body -->
    <path d="M-165-200h330a34,34 0 0 1 34,34v352a76,76 0 0 1 -76,76h-246a76,76 0 0 1 -76,-76v-352a34,34 0 0 1 34,-34z" fill="url(#glass)" stroke="#D9C79A" stroke-width="4"/>
    <!-- ghee fill -->
    <path d="M-150-150h300v336a76,76 0 0 1 -76,76h-148a76,76 0 0 1 -76,-76z" fill="url(#ghee)"/>
    <!-- grain -->
    <g fill="#C98613" opacity="0.5">
      <circle cx="-70" cy="90" r="11"/><circle cx="-20" cy="130" r="9"/><circle cx="30" cy="100" r="12"/>
      <circle cx="80" cy="140" r="8"/><circle cx="-110" cy="150" r="9"/><circle cx="10" cy="190" r="10"/>
    </g>
    <!-- highlight -->
    <rect x="-122" y="-120" width="46" height="330" rx="23" fill="#fff" opacity="0.28"/>
    <rect x="96" y="-90" width="22" height="220" rx="11" fill="#fff" opacity="0.18"/>
    <!-- lid -->
    <path d="M-185-250h370v40a46,46 0 0 1 -46,46h-278a46,46 0 0 1 -46,-46z" fill="url(#lid2)"/>
    <ellipse cx="0" cy="-250" rx="185" ry="42" fill="#D14A34"/>
    <ellipse cx="0" cy="-250" rx="130" ry="29" fill="#B23A26"/>
    <g fill="none" stroke="#fff" stroke-width="3" opacity="0.4">
      <ellipse cx="0" cy="-250" rx="130" ry="29"/>
    </g>
    <!-- label -->
    <rect x="-140" y="-40" width="280" height="190" rx="20" fill="#fff" opacity="0.95"/>
    <rect x="-140" y="-40" width="280" height="190" rx="20" fill="none" stroke="#EFD79A" stroke-width="3"/>
    <text x="0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-style="italic" font-weight="700" fill="#B3341F">Pure</text>
    <text x="0" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#B3341F" letter-spacing="1">GHEE</text>
    <text x="0" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#8A6A2B" letter-spacing="3">BILONA · 500 ml</text>
    <rect x="46" y="126" width="22" height="22" rx="4" fill="#15713A"/>
    <text x="78" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#15713A">100% VEG</text>
  </g>

  <!-- spoon swirl -->
  <g transform="translate(450,900)" opacity="0.9">
    <path d="M-170 0c46-34 88 18 134-6s88 18 134-6" fill="none" stroke="#F2B93C" stroke-width="16" stroke-linecap="round"/>
    <path d="M-170 0c46-34 88 18 134-6s88 18 134-6" fill="none" stroke="#FFE9A8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect x="0" y="995" width="900" height="105" fill="#15713A"/>
  <text x="450" y="1042" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" letter-spacing="4">HAND CHURNED BILONA</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#B9E3C8" letter-spacing="2">NO VEGETABLE OIL · GRAINY &amp; GOLDEN</text>
</svg>
