<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maa Saraswati Fresh Cooking Cream">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#EDEFEA"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8ECE6"/>
      <stop offset="0.28" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F4F7F3"/>
      <stop offset="1" stop-color="#DDE3DB"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9E52"/><stop offset="1" stop-color="#15713A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="150" cy="270" r="160" fill="#2E9E52" opacity="0.09"/>
  <circle cx="800" cy="880" r="175" fill="#FFFFFF" opacity="0.7"/>
  <g opacity="0.5" fill="#2E9E52">
    <circle cx="800" cy="320" r="8"/><circle cx="120" cy="720" r="7"/><circle cx="170" cy="770" r="5"/>
  </g>

  <!-- brand badge -->
  <g transform="translate(450,120)">
    <path d="M-175,-70h350a45,45 0 0 1 45,45v50a45,45 0 0 1 -45,45h-350a45,45 0 0 1 -45,-45v-50a45,45 0 0 1 45,-45z" fill="#15713A"/>
    <path d="M-160,-58h320a36,36 0 0 1 36,36v42a36,36 0 0 1 -36,36h-320a36,36 0 0 1 -36,-36v-42a36,36 0 0 1 36,-36z" fill="none" stroke="#fff" stroke-width="5" opacity="0.85"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#fff" letter-spacing="2">MAA</text>
    <text x="0" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#fff" letter-spacing="1">SARASWATI</text>
  </g>

  <!-- pouch -->
  <g transform="translate(450,610)">
    <ellipse cx="0" cy="250" rx="205" ry="42" fill="#8A9A8C" opacity="0.2"/>
    <path d="M-195-235h390v400a76,76 0 0 1 -76,76h-238a76,76 0 0 1 -76,-76z" fill="url(#pouch)" stroke="#D5DCD3" stroke-width="4"/>
