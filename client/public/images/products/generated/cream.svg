      <rect x="-140" y="-259" width="14" height="24" rx="5"/>
      <rect x="-85" y="-259" width="14" height="24" rx="5"/>
      <rect x="-30" y="-259" width="14" height="24" rx="5"/>
      <rect x="25" y="-259" width="14" height="24" rx="5"/>
      <rect x="80" y="-259" width="14" height="24" rx="5"/>
      <rect x="135" y="-259" width="14" height="24" rx="5"/>
