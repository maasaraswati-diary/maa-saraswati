    <rect x="-170" y="60" width="340" height="160" rx="18" fill="none" stroke="#DCE7E0" stroke-width="3"/>
    <text x="0" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" font-weight="700" fill="#15713A">Fresh</text>
    <text x="0" y="154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#15713A" letter-spacing="1">CREAM</text>
    <text x="0" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#4E6B58" letter-spacing="3">25% FAT · 200 ml</text>
    <rect x="66" y="196" width="22" height="20" rx="4" fill="#15713A"/>
    <text x="98" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#15713A">100% VEGETARIAN</text>
