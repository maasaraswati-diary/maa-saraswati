    <circle cx="140" cy="-205" r="15" fill="#fff" opacity="0.9"/>
    <!-- cream swirl -->
    <g transform="translate(0,10)">
      <path d="M-120 60c0-42 40-52 40-88 0-24-22-30-22-52 0-30 34-40 34-66 0-16-12-22-12-34 0-16 18-22 18-34 0-10-8-14-8-22h136c0 30-30 36-30 62 0 32 34 42 34 72 0 26-24 34-24 58 0 30 26 40 26 68 0 22-16 30-16 46z" fill="#FFFFFF" opacity="0.9"/>
      <path d="M-96 20c0-30 32-40 32-66 0-18-16-24-16-40 0-24 26-30 26-50" fill="none" stroke="#F4C7D6" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M-60 90c0-30 30-38 30-64" fill="none" stroke="#F4C7D6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </g>
