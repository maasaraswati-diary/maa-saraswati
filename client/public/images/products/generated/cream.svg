  <!-- gravy swirl -->
  <path d="M310 905c38 0 38 24 76 24s38-24 76-24 38 24 76 24" fill="none" stroke="#DCE7E0" stroke-width="15" stroke-linecap="round"/>

  <rect x="0" y="995" width="900" height="105" fill="#15713A"/>
  <text x="450" y="1042" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" letter-spacing="4">THICKENS ANY GRAVY</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#B9E3C8" letter-spacing="2">MADE FRESH DAILY · NO THICKENER</text>
