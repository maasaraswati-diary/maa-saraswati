<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maa Saraswati Sliced Cheddar Cheese">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#FDEBD3"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD066"/><stop offset="1" stop-color="#F0A828"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC14D"/><stop offset="1" stop-color="#E29218"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB833"/><stop offset="1" stop-color="#D2800F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="140" cy="260" r="160" fill="#F0A828" opacity="0.14"/>
  <circle cx="800" cy="880" r="175" fill="#15713A" opacity="0.06"/>

  <!-- brand badge -->
  <g transform="translate(450,120)">
    <path d="M-175,-70h350a45,45 0 0 1 45,45v50a45,45 0 0 1 -45,45h-350a45,45 0 0 1 -45,-45v-50a45,45 0 0 1 45,-45z" fill="#F26522"/>
    <path d="M-160,-58h320a36,36 0 0 1 36,36v42a36,36 0 0 1 -36,36h-320a36,36 0 0 1 -36,-36v-42a36,36 0 0 1 36,-36z" fill="none" stroke="#fff" stroke-width="5" opacity="0.85"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#fff" letter-spacing="2">MAA</text>
    <text x="0" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#fff" letter-spacing="1">SARASWATI</text>
  </g>

  <!-- cheese stack -->
  <g transform="translate(450,600)">
    <ellipse cx="0" cy="235" rx="265" ry="45" fill="#B0781B" opacity="0.18"/>

    <!-- bottom slice -->
    <g transform="translate(0,120)">
      <path d="M-250-40h500a16,16 0 0 1 16,16v54a16,16 0 0 1 -16,16h-500a16,16 0 0 1 -16,-16v-54a16,16 0 0 1 16,-16z" fill="url(#s3)"/>
      <path d="M-250-40h500a16,16 0 0 1 16,16v-14l-532 0v14a16,16 0 0 1 16,-16z" fill="#FFC65E" opacity="0.75"/>
      <g fill="#C97A0C" opacity="0.65">
        <circle cx="-160" cy="0" r="13"/><circle cx="-40" cy="14" r="9"/><circle cx="90" cy="-2" r="15"/>
        <circle cx="185" cy="16" r="10"/><circle cx="-235" cy="18" r="8"/>
      </g>
    </g>

    <!-- middle slice -->
    <g transform="translate(-14,42)">
      <path d="M-250-40h500a16,16 0 0 1 16,16v54a16,16 0 0 1 -16,16h-500a16,16 0 0 1 -16,-16v-54a16,16 0 0 1 16,-16z" fill="url(#s2)"/>
      <path d="M-250-40h500a16,16 0 0 1 16,16v-14l-532 0v14a16,16 0 0 1 16,-16z" fill="#FFD97A" opacity="0.75"/>
      <g fill="#C97A0C" opacity="0.6">
        <circle cx="-195" cy="6" r="11"/><circle cx="-70" cy="-4" r="8"/><circle cx="55" cy="12" r="14"/>
        <circle cx="205" cy="0" r="9"/><circle cx="130" cy="20" r="7"/>
      </g>
    </g>

    <!-- top slice -->
    <g transform="translate(-28,-36)">
      <path d="M-250-40h500a16,16 0 0 1 16,16v54a16,16 0 0 1 -16,16h-500a16,16 0 0 1 -16,-16v-54a16,16 0 0 1 16,-16z" fill="url(#s1)"/>
      <path d="M-250-40h500a16,16 0 0 1 16,16v-14l-532 0v14a16,16 0 0 1 16,-16z" fill="#FFE29A" opacity="0.8"/>
      <g fill="#C97A0C" opacity="0.55">
        <circle cx="-150" cy="2" r="12"/><circle cx="-10" cy="16" r="9"/><circle cx="120" cy="0" r="13"/>
        <circle cx="225" cy="18" r="8"/><circle cx="-225" cy="20" r="9"/>
      </g>
      <!-- wedge cut out -->
      <path d="M60-40l0,86" stroke="#FFE8B0" stroke-width="4" opacity="0.6"/>
    </g>

    <!-- label plaque -->
    <g transform="translate(0,236)">
      <rect x="-200" y="-6" width="400" height="118" rx="20" fill="#fff" opacity="0.96"/>
      <rect x="-200" y="-6" width="400" height="118" rx="20" fill="none" stroke="#EFD79A" stroke-width="3"/>
      <text x="0" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" font-weight="700" fill="#B3341F">Aged</text>
      <text x="0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#B3341F" letter-spacing="1">CHEDDAR SLICES</text>
      <text x="0" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#8A6A2B" letter-spacing="2">10 SLICES · 200 g</text>
    </g>
  </g>

  <!-- melted drip -->
  <path d="M300 900c40 0 40 26 80 26s40-26 80-26 40 26 80 26" fill="none" stroke="#F0A828" stroke-width="15" stroke-linecap="round" opacity="0.85"/>

  <rect x="0" y="995" width="900" height="105" fill="#B3341F"/>
  <text x="450" y="1042" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" letter-spacing="4">MELTS EVENLY EVERY TIME</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#F6C9A8" letter-spacing="2">100% VEGETARIAN · AGED CHEDDAR</text>
</svg>
