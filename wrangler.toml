# Cloudflare Pages + Cloudflare R2
#
# The site's files are served by Pages (free, unlimited bandwidth). The films
# themselves live in R2, which is also free for this size of shop: 10 GB of
# storage and, importantly, no charge for the data coming back out - which was
# the whole reason for moving off Firebase Hosting's 360 MB a day.
#
# R2 has to be switched on in the Cloudflare dashboard once (it asks for a card
# even on the free tier, but nothing is charged while you stay inside it). After
# that, `npx wrangler r2 bucket create maa-videos` makes the bucket this file
# points at.
name = "maa-saraswati"
compatibility_date = "2024-11-01"
pages_build_output_dir = "client/dist"

# R2 was the first choice and is the better one: it holds any size of file and
# its reads cost nothing. It cannot be used here, because Cloudflare will not
# switch R2 on until a card is on the account, and a card is not something this
# project should ask for. So the films go in Workers KV, which is free without
# one.
#
# KV holds 1 GB, allows 100,000 reads a day, and takes a single value of up to
# 25 MB - which is a whole film, not a piece of one. A film is therefore stored
# whole, and reading one back costs one read.
#
# KV namespaces are created from the command line and cost nothing:
#   npx wrangler kv namespace create maa-videos
[[kv_namespaces]]
binding = "VIDEOS"
id = "02c088b3f5f34f8289f68e372358fad1"
